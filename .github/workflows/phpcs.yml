name: PHP_CodeSniffer

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
        - 'src/**'
        - 'composer.lock'
        - '.github/workflows/phpcs.yml'
  pull_request:
    paths:
        - 'src/**'
        - 'composer.lock'
        - '.github/workflows/phpcs.yml'

jobs:
  phpcs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Verificar versão
        run: php -v

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Verificar sintaxe PHP
        run: |
          find src tests_sei5 -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-suggest --no-progress

      - name: Detect coding standard violations
        run: src/vendor/bin/phpcs -q --report=checkstyle src

      - name: Verificar Rector
        run: src/vendor/bin/rector process --dry-run

